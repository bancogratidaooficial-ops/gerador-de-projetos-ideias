<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODIFICADOR - CINE GRATIFLIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.box{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin-bottom:12px}
input,select,textarea{width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;margin:6px 0}
button{padding:12px 16px;border:0;border-radius:8px;font-weight:900;cursor:pointer;margin:4px}

.filme-item{display:flex;justify-content:space-between;background:#000;padding:8px;margin:4px 0;border-radius:8px;font-size:12px}
.chip{display:inline-block;background:#222;border:1px solid #333;padding:6px 10px;border-radius:20px;margin:3px;font-size:11px}
.chip.ativo{background:#f00;border-color:#f00}
</style>
</head>
<body>
<h2>⚙️ CODIFICADOR CINE GRATIFLIX - 89 FILMES</h2>

<div class="box">
<b>📁 GERENCIAR PASTAS (GÊNEROS)</b>
<div style="display:flex;gap:6px"><input id="novaPasta" placeholder="Nome da pasta ex: AÇÃO"><button class="btn-amarelo" onclick="addPasta()">+ PASTA</button></div>
<div id="listaPastas"></div>
</div>

<div class="box">
<b>🎬 ADICIONAR FILME</b>
<input id="tFilme" placeholder="Título do filme ex: Hitimam">
<input id="idVideo" placeholder="ID do YouTube ex: x5QSOVQJM2w ou link completo https://youtu.be/...">
<select id="tagFilme"></select>
<button class="btn-verde" onclick="addFilme()">+ ADICIONAR FILME</button>
<hr>
<b>📥 COLAR VÁRIOS LINKS DE UMA VEZ (Aline)</b>
<textarea id="bulkLinks" rows="6" placeholder="Cole aqui todos os links https://youtu.be/... um por linha"></textarea>
<button class="btn-amarelo" onclick="addBulk()">ADICIONAR TODOS OS LINKS COMO LANÇAMENTO</button>
</div>

<div class="box">
<b>📋 FILMES CADASTRADOS (<span id="totalFilmes">0</span>)</b>
<div id="listaFilmes"></div>
</div>

<div class="box">
<b>🔗 GERAR LINK CODIFICADO E INDEX.HTML PERMANENTE</b>
<button class="btn-verde" style="width:100%;padding:16px" onclick="gerar()">GERAR TUDO</button>
<p>Link Codificado:</p>
<textarea id="outLink" rows="4" readonly></textarea>
<button class="btn-amarelo" onclick="copiarLink()">COPIAR LINK</button>
<button class="btn-verde" onclick="abrirLink()">ABRIR LINK E TESTAR</button>
<hr>
<p>index.html permanente (já com filmes fixos):</p>
<textarea id="outIndex" rows="8" readonly></textarea>
<button class="btn-verde" onclick="copiarIndex()">COPIAR INDEX.HTML</button>
</div>

<script>
let generos = JSON.parse(localStorage.getItem('cine_generos')||'null') || ["LANÇAMENTO","AÇÃO","BIBLICOS","TERROR","COMÉDIA"];
let filmes = JSON.parse(localStorage.getItem('cine_filmes_pastas')||'null') || [
{"t":

function salvar(){localStorage.setItem('cine_filmes_pastas',JSON.stringify(filmes));localStorage.setItem('cine_generos',JSON.stringify(generos));render();}
function render(){
document.getElementById('totalFilmes').innerText=filmes.length;
document.getElementById('listaPastas').innerHTML=generos.map(g=>`<span class="chip">${g} <b onclick="delPasta('${g}')" style="color:#f00;cursor:pointer"> x</b></span>`).join('');
document.getElementById('tagFilme').innerHTML=generos.map(g=>`<option>${g}</option>`).join('');
document.getElementById('listaFilmes').innerHTML=filmes.map((f,i)=>`<div class="filme-item"><span>${f.t} [${f.tag}]</span><span><b onclick="delFilme(${i})" style="color:#f00;cursor:pointer">EXCLUIR</b></span></div>`).join('');
}
function addPasta(){let v=document.getElementById('novaPasta').value.trim().toUpperCase();if(!v)return;if(!generos.includes(v)){generos.push(v);document.getElementById('novaPasta').value='';salvar();}}
function delPasta(g){if(g==="LANÇAMENTO")return alert('Não pode apagar LANÇAMENTO');generos=generos.filter(x=>x!==g);salvar();}
function extrairID(url){let m=url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);if(m)return m[1];if(url.length===11)return url;let m2=url.match(/([A-Za-z0-9_-]{11})/);return m2?m2[1]:null;}
function addFilme(){
let t=document.getElementById('tFilme').value.trim()||'Filme '+(filmes.length+1);
let idRaw=document.getElementById('idVideo').value.trim();
let tag=document.getElementById('tagFilme').value;
let vid=extrairID(idRaw);if(!vid)return alert('ID inválido');
filmes.push({t:t,tag:tag,img:`https://img.youtube.com/vi/${vid}/hqdefault.jpg`,vid:vid});
document.getElementById('tFilme').value='';document.getElementById('idVideo').value='';salvar();
}
function addBulk(){
let txt=document.getElementById('bulkLinks').value;if(!txt.trim())return;
let linhas=txt.split('\n');let c=0;
linhas.forEach(l=>{
let vid=extrairID(l.trim());if(vid){filmes.push({t:`Filme ${filmes.length+1}`,tag:'LANÇAMENTO',img:`https://img.youtube.com/vi/${vid}/hqdefault.jpg`,vid:vid});c++;}
});
document.getElementById('bulkLinks').value='';salvar();alert(c+' filmes adicionados!');
}
function delFilme(i){filmes.splice(i,1);salvar();}
function gerar(){
localStorage.setItem('cine_filmes_pastas',JSON.stringify(filmes));
localStorage.setItem('cine_generos',JSON.stringify(generos));

// GERA INDEX.HTML 100% PERMANENTE COM FILMES FIXOS DENTRO

let generosFixos=JSON.stringify(generos);
let indexPermanente=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINE GRATIFLIX</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial}.top{background:#000;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:1px solid #222}.hero{padding:14px}.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.chip{white-space:nowrap;background:#111;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer}.chip.ativo{background:#f00;border-color:#f00;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:16px}.card{background:#111;border-radius:15px;overflow:hidden;border:1px solid #222;cursor:pointer;position:relative}.card img{width:100%;height:210px;object-fit:cover;background:#222}.tag{position:absolute;top:0;left:0;margin:8px;background:#ffcc00;color:#000;font-size:9px;padding:5px 8px;border-radius:20px;font-weight:900}.nome{padding:8px;font-size:12px;font-weight:700;text-align:center}#player{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}#paywall{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:998;display:none;align-items:flex-end}.paybox{background:#121212;width:100%;border-radius:22px 22px 0 0;padding:20px}</style></head><body><div class="top"><div style="font-weight:900">🎬 CINE <b style="color:#f00">GRATIFLIX</b></div><div onclick="location.href='codificador.html'" style="color:#ffcc00;font-weight:900">⚙️</div></div><div class="hero"><div id="chips" class="chips"></div><div id="conteudo"></div></div><div id="player"><div style="padding:12px;background:#000;display:flex;justify-content:space-between"><b id="playerTitulo"></b><span onclick="fecharPlayer()" style="background:#222;padding:6px 12px;border-radius:20px">✕</span></div><div id="playerVideo" style="flex:1"></div></div><div id="paywall"><div class="paybox"><div style="display:flex;justify-content:space-between"><b>🔒 VIP</b><span onclick="fecharPaywall()">✕</span></div><p>Entre no grupo</p><button onclick="window.open('https://chat.whatsapp.com/BtNurXoNfSg2V2QbXTasC7s','_blank')" style="width:100%;padding:14px;background:#00ff88;border:0;border-radius:12px;font-weight:900">ENTRAR NO GRUPO</button></div></div><script>let filmesPadrao=${filmesFixos};let generos=${generosFixos};let filtro="TODOS";function renderChips(){let counts={};filmesPadrao.forEach(f=>counts[f.tag]=(counts[f.tag]||0)+1);let h=\`<div class="chip \${filtro==="TODOS"?"ativo":""}" onclick="setFiltro('TODOS')">TODOS (\${filmesPadrao.length})</div>\`;generos.forEach(g=>{let c=counts[g]||0;h+=\`<div class="chip \${filtro===g?"ativo":""}" onclick="setFiltro('\${g}')">\${g} (\${c})</div>\`;});document.getElementById('chips').innerHTML=h;}function setFiltro(g){filtro=g;renderChips();renderGrid();}function renderGrid(){let lista=filtro==="TODOS"?filmesPadrao:filmesPadrao.filter(f=>f.tag===filtro);window.todos=lista;let html=\`<div class="grid">\`+lista.map((f,i)=>\`<div class="card" data-i="\${i}"><span class="tag">\${f.tag}</span><img src="\${f.img}" loading="lazy"><div class="nome">\${f.t}</div></div>\`).join('')+'</div>';document.getElementById('conteudo').innerHTML=html;document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>abrirPlayer(parseInt(el.dataset.i))));}function abrirPlayer(i){let f=window.todos[i];document.getElementById('playerTitulo').innerText=f.t;document.getElementById('playerVideo').innerHTML=\`<iframe width="100%" height="100%" src="https://www.youtube.com/embed/\${f.vid}?autoplay=1" frameborder="0" allowfullscreen></iframe>\`;document.getElementById('player').style.display='flex';setTimeout(()=>{document.getElementById('paywall').style.display='flex'},120000);}function fecharPlayer(){document.getElementById('player').style.display='none';document.getElementById('playerVideo').innerHTML='';fecharPaywall();}function fecharPaywall(){document.getElementById('paywall').style.display='none';}renderChips();renderGrid();<\/script></body></html>`;
document.getElementById('outIndex').value=indexPermanente;
alert('GERADO! Agora seu index.html é 100% permanente, não apaga mais!');
}
function copiarLink(){let t=document.getElementById('outLink');t.select();document.execCommand('copy');alert('Link copiado!');}
function abrirLink(){let l=document.getElementById('outLink').value;if(l)window.open(l,'_blank');}
function copiarIndex(){let t=document.getElementById('outIndex');t.select();document.execCommand('copy');alert('index.html permanente copiado! Cola no GitHub');}
render();
</script>
</body>
</html>
